# Email relay Worker: receives the domain's mail through Cloudflare Email Routing
# and forwards it to the app on Vercel. Deploy with `npm run relay:deploy`.
name = "burnbox-email-relay"
main = "worker.ts"
compatibility_date = "2025-10-01"
# Email only: no public workers.dev URL needed.
workers_dev = false

[vars]
# Where the app is hosted. Mail is posted to APP_URL/api/inbound.
# Use the address Vercel serves without a redirect: a redirect drops the secret.
APP_URL = "https://www.burnbox.sbs"

# Secret (set with `npx wrangler secret put INBOUND_SECRET --config relay/wrangler.toml`):
# INBOUND_SECRET, the same value as INBOUND_SECRET in your Vercel project settings.

[observability]
enabled = true
